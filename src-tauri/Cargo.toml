[package]
name = "jazz-guitar-drop-helper"
version = "0.1.0"
description = "Drop voicings on the guitar fretboard"
license = "MIT"
repository = "https://github.com/andeliseev/jazz-guitar-helper"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-focused release build, as in Unified Mail: https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
