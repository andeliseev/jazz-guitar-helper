<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jazz Guitar Helper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <!-- The app icon (app-icon.svg). -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="#dd6b10"/><g fill="none" stroke="#fff" stroke-linecap="round"><path d="M7.5 6.6h9" stroke-width="1.7"/><path d="M7.5 10.4h9M7.5 14.2h9M7.5 18h9M7.5 6.6v11.4M10.5 6.6v11.4M13.5 6.6v11.4M16.5 6.6v11.4" stroke-width="0.85"/></g><g fill="#fff"><circle cx="7.5" cy="8.5" r="1.5"/><circle cx="10.5" cy="16.1" r="1.5"/><circle cx="13.5" cy="12.3" r="1.5"/><circle cx="16.5" cy="16.1" r="1.5"/></g></svg>
        Jazz Guitar Helper
      </div>

      <div class="side-head">
        <span class="side-title">Progression</span>
        <span class="head-actions">
          <button id="save-preset" class="link-btn" title="Keep this progression under My presets">Save</button>
          <button id="clear" class="link-btn" title="Remove all chords">Clear</button>
        </span>
      </div>
      <!-- One row per chord (renderSidebar): its color, name, notes and the pinned voicing's frets. -->
      <div id="chords"></div>
      <form id="add-form" class="add-row" autocomplete="off">
        <input id="add-input" placeholder="Add chords: Dm7 G7 Cmaj7" aria-label="Add chords" spellcheck="false"
               role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
        <button type="submit" class="icon-btn" title="Add (Enter)" aria-label="Add">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <!-- Chords that fit the one being typed (renderSuggestions). -->
        <div id="suggest" class="suggest" role="listbox" aria-label="Chord suggestions" hidden></div>
      </form>

      <div class="side-head">
        <span class="side-title">Presets</span>
        <label class="key-pick">in <select id="key" aria-label="Key"></select></label>
      </div>
      <!-- A click puts a preset in place of the progression; its + adds it to the end. -->
      <div id="presets" class="presets"></div>

      <div class="side-head">
        <span class="side-title">My presets</span>
      </div>
      <!-- The name field while saving (Save), then the progressions saved (renderSaved). -->
      <form id="save-form" class="save-row" autocomplete="off" hidden>
        <input id="save-name" aria-label="Name for the preset" placeholder="Name" spellcheck="false">
      </form>
      <div id="saved"></div>

      <div class="spacer"></div>
      <button id="open-settings" class="side-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
    </aside>

    <main id="main">
      <!-- What's voiced and how it's shown. It's also where the window is dragged (initTitleBar). -->
      <header id="toolbar">
        <!-- What's voiced. -->
        <div class="tool-row">
          <div id="drop" class="segmented" role="radiogroup" aria-label="What the fretboards show">
            <button role="radio" title="Every note of each chord on the whole neck, without voicings (1)">Chord tones</button>
            <button role="radio" data-drop="drop2" title="Drop 2 (2)">Drop 2</button>
            <button role="radio" data-drop="drop3" title="Drop 3 (3)">Drop 3</button>
            <button role="radio" data-drop="drop24" title="Drop 2&amp;4 (4)">Drop 2&amp;4</button>
          </div>
          <div class="group">
            <span class="group-label">Strings</span>
            <div id="sets" class="chips"></div>
          </div>
          <div class="group">
            <span class="group-label">Inversions</span>
            <div id="inversions" class="chips">
              <button class="chip" data-inversion="0" title="Root in the bass. Double-click to show only these.">Root</button>
              <button class="chip" data-inversion="1" title="3rd in the bass. Double-click to show only these.">1st</button>
              <button class="chip" data-inversion="2" title="5th in the bass. Double-click to show only these.">2nd</button>
              <button class="chip" data-inversion="3" title="7th (or 6th) in the bass. Double-click to show only these.">3rd</button>
            </div>
          </div>
        </div>
        <!-- How it's shown. Below the first row when the window is too narrow for both. -->
        <div class="tool-row">
          <div id="labels" class="segmented" role="radiogroup" aria-label="Note labels">
            <button role="radio" data-labels="intervals" title="Intervals on the dots (N)">Intervals</button>
            <button role="radio" data-labels="notes" title="Note names on the dots (N)">Notes</button>
          </div>
          <div id="view" class="segmented" role="radiogroup" aria-label="View">
            <button role="radio" data-view="stacked" title="A fretboard per chord, one under another (V)">Stacked</button>
            <button role="radio" data-view="overlay" title="All chords on one fretboard (V)">Overlay</button>
          </div>
          <button id="leading" class="chip toggle" aria-pressed="false"
                  title="Click a voicing and the other chords show their closest voicings on the same strings (L)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="16" r="2.2"/><circle cx="12" cy="8" r="2.2"/><circle cx="19" cy="14" r="2.2"/><path d="M6.4 14.3l4.2-4.6M13.9 9.2l3.3 3.4"/></svg>
            Voice leading
          </button>
          <button id="all-notes" class="chip toggle" aria-pressed="false"
                  title="Every note of each chord on the whole neck, on all strings, besides its voicings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="1.2"/><circle cx="12" cy="6" r="1.2"/><circle cx="18" cy="6" r="1.2"/><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/><circle cx="6" cy="18" r="1.2"/><circle cx="12" cy="18" r="1.2"/><circle cx="18" cy="18" r="1.2"/></svg>
            All notes
          </button>
          <button id="scales" class="chip toggle" aria-pressed="false"
                  title="Each chord's scale on the neck, outlined around its notes; choose it over each fretboard (S)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h4v-4h4v-4h4V7h4"/></svg>
            Scales
          </button>
          <!-- The fretboards' size, one group so it wraps as a whole. -->
          <div class="size-group">
            <label class="height-pick" title="How many frets the fretboards show">
              <span class="group-label">Frets</span>
              <select id="frets" aria-label="Frets"></select>
            </label>
            <label class="height-pick" title="How tall the fretboards are; Stacked and Overlay each keep their own. Double-click to reset.">
              <span class="group-label">Height</span>
              <input id="height" type="range" min="16" max="44" step="1" aria-label="Fretboard height">
            </label>
            <button id="fit" class="link-btn" title="As tall as the window allows with every fretboard showing">Fit</button>
          </div>
        </div>
      </header>

      <!-- The progression on a staff (renderStaff, staff.js), when Staff is on: a bar every four beats. -->
      <section id="staff" hidden>
        <div class="staff-head">
          <span class="group-label">Staff</span>
          <div id="staff-shows" class="segmented small" role="radiogroup" aria-label="What the staff shows">
            <button role="radio" data-shows="chords" title="Each chord's pinned voicing, or else its notes from the root">Chords</button>
            <button role="radio" data-shows="scales" title="Each chord's scale, from its root">Scales</button>
          </div>
        </div>
        <div id="staff-scroll"><svg id="staff-svg" role="img" aria-label="The progression on a staff"></svg></div>
      </section>

      <!-- The fretboards (renderBoards): a board per chord, or one for all, each with its fret numbers under it. -->
      <div id="boards"></div>
      <div id="empty" class="empty" hidden>
        <p id="empty-text"></p>
        <button id="empty-add" class="primary">Add ii–V–I in C</button>
      </div>

      <!-- The metronome (player): plays the progression, each chord for its length (its select in the sidebar). -->
      <footer id="player">
        <button id="play" aria-pressed="false" title="Play the progression with a metronome (Space)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-play" d="M8 5.5v13l10.5-6.5z"/><path class="icon-stop" d="M7 7h10v10H7z"/></svg>
          <span id="play-text">Play</span>
        </button>
        <div class="tempo" title="Tempo in beats a minute: drag, or type a number from 40 to 240">
          <input id="tempo" type="range" min="40" max="240" step="1" aria-label="Tempo">
          <input id="tempo-number" type="number" min="40" max="240" step="1" aria-label="Tempo in beats a minute">
          <span>BPM</span>
        </div>
        <div class="chips">
          <button class="chip" data-option="countIn" aria-pressed="true" title="A bar of clicks before the first chord">Count-in</button>
          <button class="chip" data-option="follow" aria-pressed="false" title="While playing, only the chord playing and the next one, as tall as the window allows">Follow</button>
        </div>
        <!-- The click (renderSound): the button names its sound; its card chooses it and how loud. -->
        <div class="sound-pick">
          <button id="click-button" class="chip toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="click-card"
                  title="The metronome's click on every beat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 21h7l-2.2-17h-2.6z"/><path d="M12 16l5.5-9.5"/></svg>
            <span id="click-name">Tick</span>
          </button>
          <div id="click-card" class="sound-card" role="dialog" aria-label="Click" hidden>
            <span class="group-label">Click</span>
            <div id="clicks" class="sound-list" role="radiogroup" aria-label="Click sound"></div>
            <label class="sound-row" title="The click against the chords">
              <span>Volume</span><input id="click-volume" type="range" min="0" max="100" step="1">
            </label>
          </div>
        </div>
        <!-- The chords' sound (renderSound): the button names it; its card, hidden until then, chooses it. -->
        <div class="sound-pick">
          <button id="sound-button" class="chip toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="sound-card"
                  title="How the chords sound while playing">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            <span id="sound-name">Ambient</span>
          </button>
          <div id="sound-card" class="sound-card" role="dialog" aria-label="Chords' sound" hidden>
            <span class="group-label">Chords' sound</span>
            <div id="sounds" class="sound-list" role="radiogroup" aria-label="Sound"></div>
            <label class="sound-row" title="How much room the sound has: none is dry, all the way is a hall">
              <span>Space</span><input id="space" type="range" min="0" max="100" step="1">
            </label>
            <label class="sound-row" title="The chords against the click">
              <span>Volume</span><input id="volume" type="range" min="0" max="100" step="1">
            </label>
            <label class="setting-row switch">
              <span>Bass <small class="muted">The root an octave lower</small></span>
              <input id="bass" type="checkbox">
            </label>
          </div>
        </div>
        <span id="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="play-status" role="status"></span>
        <button id="staff-toggle" class="chip toggle" aria-pressed="false" title="The progression on a staff, over the fretboards: the bars this plays">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 10h18M3 14h18M3 18h18"/><path d="M14 16V5"/><ellipse cx="11.6" cy="16.4" rx="2.6" ry="1.9"/></svg>
          Staff
        </button>
      </footer>
    </main>
  </div>

  <!-- Windows only (initTitleBar): the window has no system title bar, so the app draws its
       buttons, with glyphs from the system's Segoe Fluent Icons / Segoe MDL2 Assets. -->
  <div id="window-buttons" hidden>
    <button id="win-min" title="Minimize" aria-label="Minimize" tabindex="-1">&#xE921;</button>
    <button id="win-max" title="Maximize" aria-label="Maximize" tabindex="-1">&#xE922;</button>
    <button id="win-close" title="Close" aria-label="Close" tabindex="-1">&#xE8BB;</button>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="card" role="dialog" aria-labelledby="settings-title">
      <button id="close-settings" class="icon-btn close" title="Close (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 id="settings-title">Settings</h2>

      <section>
        <h3>Appearance</h3>
        <div id="theme" class="segmented" role="radiogroup" aria-label="Appearance">
          <button role="radio" data-theme="system">System</button>
          <button role="radio" data-theme="light">Light</button>
          <button role="radio" data-theme="dark">Dark</button>
        </div>
      </section>

      <section>
        <h3>Fretboard</h3>
        <label class="setting-row switch">
          <span>Left-handed <small class="muted">The nut on the right</small></span>
          <input id="left-handed" type="checkbox">
        </label>
        <label class="setting-row switch">
          <span>Open strings <small class="muted">Voicings that use them, near the nut</small></span>
          <input id="open-strings" type="checkbox">
        </label>
      </section>

      <!-- The links open in the browser (open_external). -->
      <section id="about">
        <p>Jazz Guitar Helper <span id="app-version"></span> <button id="update" hidden></button></p>
        <p>
          <a href="#" data-href="https://github.com/andeliseev/jazz-guitar-helper">GitHub</a> ·
          <a href="#" data-href="https://github.com/andeliseev/jazz-guitar-helper/releases">Releases</a> ·
          <a href="#" data-href="https://andeliseev.github.io/jazz-guitar-helper/">Website</a> ·
          <a href="#" data-href="https://andeliseev.github.io/jazz-guitar-helper/privacy.html">Privacy policy</a> ·
          <a href="#" data-href="https://andeliseev.github.io/jazz-guitar-helper/support.html">Support</a>
        </p>
        <p>© 2026 Andrei Eliseev</p>
      </section>
    </div>
  </div>

  <div id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" hidden></button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
